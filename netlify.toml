[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_GITHUB_BRANCH,VITE_LOCKOUT_DURATION,VITE_CACHE_DURATION,VITE_LOCKOUT_MAX_ATTEMPTS,VITE_GITHUB_OWNER,VITE_GITHUB_REPO,VITE_DEFAULT_PIN"
